services:
  distribution-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-development-secret-change-me}
      MOCK_PARTNER_SECRET: ${MOCK_PARTNER_SECRET:-local-development-secret-change-me}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
